apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android' // Task 8: ImageEnhancerPlugin.kt

// Task 12: senha do keystore de release. Prioridade: env var PICMAX_KS_PASS (uso normal, ex.: export
// antes de ./gradlew assembleRelease) > propriedade `PICMAX_KS_PASS` num gradle.properties LOCAL não
// versionado (fallback pra quem prefere não exportar env var). SEM o keystore (picmax-release.keystore,
// gerado via keytool — ver docs/superpowers/plans, Task 12) e sem essa senha, buildTypes.release fica
// SEM signingConfig — assembleRelease ainda funciona, só produz um APK NÃO assinado (Gradle não falha
// por isso; falha só ao tentar instalar/publicar sem assinatura).
def picmaxKsPass = System.getenv('PICMAX_KS_PASS') ?: (project.hasProperty('PICMAX_KS_PASS') ? project.property('PICMAX_KS_PASS') : null)

android {
    namespace = "com.bertoldo.picmax"
    compileSdk = rootProject.ext.compileSdkVersion
    // Task 10 (IA nativa): NDK fixado na versão instalada via sdkmanager (build reproduzível).
    ndkVersion = "27.1.12297006"
    defaultConfig {
        applicationId "com.bertoldo.picmax"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Task 10: arm64-v8a = devices reais; x86_64 = emulador (smoke test — AVD revapk30).
        // Sem armeabi-v7a/x86: só vendoramos o prebuilt do NCNN pros 2 ABIs acima.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Task 10: lib nativa picmaxenhance (JNI + NCNN/Real-ESRGAN) — ver src/main/cpp/CMakeLists.txt.
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    // Task 12: keystore de release. alias fixo "picmax" (ver comando keytool no plano) — arquivo mora
    // em android/picmax-release.keystore, um nível acima deste build.gradle (android/app/).
    signingConfigs {
        release {
            if (picmaxKsPass) {
                storeFile file('../picmax-release.keystore')
                storePassword picmaxKsPass
                keyAlias 'picmax'
                keyPassword picmaxKsPass
            }
        }
    }
    buildTypes {
        release {
            // v1 (Task 12, decisão deliberada): minify/shrink DESLIGADOS. O app usa reflection via
            // Capacitor (plugins resolvidos por nome de classe) e JNI (nomes de método
            // Java_com_bertoldo_picmax_ImageEnhancerPlugin_* casados por STRING com o Kotlin) — ligar
            // R8/minify sem regras de -keep testadas arrisca quebrar exatamente esses 2 caminhos
            // (plugin não registra / UnsatisfiedLinkError) sem nenhum ganho funcional pra um app
            // pessoal sem Play Store. Reavaliar só se o tamanho do APK virar problema real.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (picmaxKsPass) {
                signingConfig signingConfigs.release
            }
        }
    }
    // capacitor.build.gradle fixa sourceCompatibility/targetCompatibility em Java 21 — o bytecode
    // Kotlin precisa do mesmo jvmTarget, senão o javac/kotlinc dessincronizam.
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
