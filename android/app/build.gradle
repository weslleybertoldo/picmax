apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android' // Task 8: ImageEnhancerPlugin.kt

// Task 12: senha do keystore de release. Prioridade: env var PICMAX_KS_PASS (uso normal, ex.: export
// antes de ./gradlew assembleRelease) > propriedade `PICMAX_KS_PASS` no `~/.gradle/gradle.properties`
// DO USUÁRIO (fallback pra quem prefere não exportar env var). ⚠️ NÃO no `android/gradle.properties`
// deste repo — esse arquivo é VERSIONADO (committed), colar a senha nele a vazaria no git (review,
// fix footgun). SEM o keystore (picmax-release.keystore, gerado via keytool — ver docs/superpowers/
// plans, Task 12) e sem essa senha, buildTypes.release fica SEM signingConfig — assembleRelease ainda
// funciona, só produz um APK NÃO assinado (Gradle não falha por isso; falha só ao tentar
// instalar/publicar sem assinatura).
def picmaxKsPass = System.getenv('PICMAX_KS_PASS') ?: (project.hasProperty('PICMAX_KS_PASS') ? project.property('PICMAX_KS_PASS') : null)

// Task 12 (review, fix sync de versão): versionName/versionCode derivados do package.json — FONTE
// ÚNICA da versão do app (o mesmo package.json que o vite.config.ts lê pra __APP_VERSION__, ver
// comentário lá). Sem isso, bumpar a versão pra testar o update in-app exigia editar 2 lugares (aqui
// e o package.json) e um deles ficava esquecido — exatamente o cenário que quebra o teste de update
// (rodapé compara __APP_VERSION__ vs a tag do GitHub; o APK instalado usa este versionCode/versionName).
// versionCode = major*10000 + minor*100 + patch (schema simples, comporta até 99 minor/patch por major
// — suficiente pro semver deste app; parts ausentes/não-numéricas caem em 0).
def pkgJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def pkgVersion = pkgJson.version as String
def pkgVerParts = pkgVersion.tokenize('.')
// parte ausente ou não-numérica (ex.: sufixo "-beta") degrada pra 0 — mesmo espírito defensivo do
// parseSemver em src/update/apkUpdater.ts (`Number(n) || 0`), não trava o build por uma versão exótica.
def pkgVerPart = { int i -> (i < pkgVerParts.size() && pkgVerParts[i].isInteger()) ? pkgVerParts[i].toInteger() : 0 }
def pkgVerMajor = pkgVerPart(0)
def pkgVerMinor = pkgVerPart(1)
def pkgVerPatch = pkgVerPart(2)

android {
    namespace = "com.bertoldo.picmax"
    compileSdk = rootProject.ext.compileSdkVersion
    // Task 10 (IA nativa): NDK fixado na versão instalada via sdkmanager (build reproduzível).
    ndkVersion = "27.1.12297006"
    defaultConfig {
        applicationId "com.bertoldo.picmax"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pkgVerMajor * 10000 + pkgVerMinor * 100 + pkgVerPatch
        versionName pkgVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Task 10: arm64-v8a = devices reais; x86_64 = emulador (smoke test — AVD revapk30).
        // Sem armeabi-v7a/x86: só vendoramos o prebuilt do NCNN pros 2 ABIs acima.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Task 10: lib nativa picmaxenhance (JNI + NCNN/Real-ESRGAN) — ver src/main/cpp/CMakeLists.txt.
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    // Task 12: keystore de release. alias fixo "picmax" (ver comando keytool no plano) — arquivo mora
    // em android/picmax-release.keystore, um nível acima deste build.gradle (android/app/).
    signingConfigs {
        release {
            if (picmaxKsPass) {
                storeFile file('../picmax-release.keystore')
                storePassword picmaxKsPass
                keyAlias 'picmax'
                keyPassword picmaxKsPass
            }
        }
    }
    buildTypes {
        release {
            // v1 (Task 12, decisão deliberada): minify/shrink DESLIGADOS. O app usa reflection via
            // Capacitor (plugins resolvidos por nome de classe) e JNI (nomes de método
            // Java_com_bertoldo_picmax_ImageEnhancerPlugin_* casados por STRING com o Kotlin) — ligar
            // R8/minify sem regras de -keep testadas arrisca quebrar exatamente esses 2 caminhos
            // (plugin não registra / UnsatisfiedLinkError) sem nenhum ganho funcional pra um app
            // pessoal sem Play Store. Reavaliar só se o tamanho do APK virar problema real.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (picmaxKsPass) {
                signingConfig signingConfigs.release
            }
        }
    }
    // capacitor.build.gradle fixa sourceCompatibility/targetCompatibility em Java 21 — o bytecode
    // Kotlin precisa do mesmo jvmTarget, senão o javac/kotlinc dessincronizam.
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
